# XenonRecomp config: Splinter Cell Double Agent (X360, 555307D7), SC4_Offline.xex (SC4.pe) from the disc.
# TU3 is not needed: its SC4_Offline.xexp changes the header only; the flat image is identical (sha256 in expected_image.txt).
# Paths are relative to this file.
# Run from repo root: external/XenonRecomp/build/XenonRecomp/XenonRecomp.exe config/scda_config.toml external/XenonRecomp/XenonUtils/ppc_context.h
[main]
file_path = "../assets/SC4_Offline.xex"
out_directory_path = "../generated"
switch_table_file_path = "scda_switches.toml"

# Optimizations off until the recomp runs.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers. Found by byte pattern (tools/xex_dump), one hit each.
restgprlr_14_address = 0x82B7FE20
